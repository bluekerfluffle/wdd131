<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Oklahoma" content="Data and weather for Oklahoma">
    <meta name="Author" content="Gracie Burris">
    <title>Oklahoma</title>
    <link rel="stylesheet" href="styles/place.css">
    <script src="scripts/place.js" defer></script>
</head>
<body id=".home-grid">
    <header>
        <h1> Oklahoma</h1>
    </header>
    <main >
        <div id="hero">
            <picture>
                <source media="(min-width: 1000px )" srcset="images/hero-large.webp">
                <source media="(min-width: 500px )" srcset="images/hero-medium.webp">
                <img src="images/hero-small.webp" alt="" width="500" height="250">
            </picture>
        </div>
        <div id="datatable">
            <h2> Data</h2>
            <div class="row">
                <div class="col">Area:</div>
                <div class="col">69,956</div>
            </div>
            <div class="row">
                <div class="col">Population:</div>
                <div class="col">4.05 Million</div>
            </div>
            <div class="row">
                <div class="col">Capital:</div>
                <div class="col">Oklahoma City</div>
            </div>
            <div class="row">
                <div class="col">Languages:</div>
                <div class="col">English, Spanish, Vietnamese, Cherokee</div>
            </div>
            <div class="row">
                <div class="col">Time Zone:</div>
                <div class="col">UTC-5</div>
            </div>
            <div class="row">
                <div class="col">Calling Code:</div>
                <div class="col">+405, +918</div>
            </div>
            <div class="row">
                <div class="col">Internet TLD:</div>
                <div class="col">.us</div>
            </div>
        </div>
        <div class="weathertable">
            <h2>Weather</h2>
            <image class="icon" src="images/icon.svg" alt="sun and clouds images"></image>
            <div class="row">
                <div class="col">Temperature: <span id="temperature"></span></div>
                <div class="col">87 °F</div>
            </div>
            <div class="row">
                <div class="col">Conditions:</div>
                <div class="col">Sunny</div>
            </div>
            <div class="row">
                <div class="col">Wind<span id="windSpeed"></span></div>
                <div class="col">14 MPH</div>
            </div>
            <div class="row">
                <div class="col">Windchill: <span id="windChill"></span></div>
                <div class="col">N/A</div>
            </div>
        </div>
    </main>
    <footer>
        <p>
            ©<span id="copyright-year"></span> Gracie Burris | Oklahoma
        </p>
        <p id="last-modified">
        </p>
    </footer>
</body>
</html>
